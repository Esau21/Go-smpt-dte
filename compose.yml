services:
  # Go API
  smpt-dte:
    container_name: smpt-dte
    build: 
      context: ./
      dockerfile: Dockerfile
    environment:
      - TRACE_TYPE=${TRACE_TYPE}
      - SERVICE_NAME=${SERVICE_NAME}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      - AFTER_LOGIN_PATH=${AFTER_LOGIN_PATH}
      - MAIL_PROVIDER=${MAIL_PROVIDER}
      # Solo si MAIL_PROVIDER incluye OUTLOOK (ver .env.example)
      - OUTLOOK_CLIENT_ID=${OUTLOOK_CLIENT_ID-}
      - OUTLOOK_CLIENT_SECRET=${OUTLOOK_CLIENT_SECRET-}
      - OUTLOOK_TENANT=${OUTLOOK_TENANT-}
      # Bucket donde se guarda todo: facturas, notas y archivos
      - FILES_BUCKET=${FILES_BUCKET:-bookeep-archivos}
      # En local el bucket es un emulador. En producción, deja esta variable
      # vacía en el .env (STORAGE_EMULATOR_HOST=) y da credenciales de Google.
      - STORAGE_EMULATOR_HOST=${STORAGE_EMULATOR_HOST-gcs:4443}
    depends_on:
      - gcs
    restart: always
    ports:
      - 8080:8080
    networks:
      - api-net
  
  # Emulador local de Google Cloud Storage (solo para desarrollo)
  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: gcs-local
    command: -scheme http -port 4443 -external-url http://gcs:4443 -public-host gcs:4443
    ports:
      - 4443:4443
    restart: always
    networks:
      - api-net
    volumes:
      - gcs_local_data:/storage

networks:
  api-net:
    driver: bridge

volumes:
  gcs_local_data: {}